## Topnav single links
## if you want to list an external url, use external_url instead of url. the theme will apply a different link base.
## use site_url for a page on the main site outside /docs/ (opens in the same tab).
topnav:
- title: Topnav
  items:
    - title: COIN-OR Home
      site_url: /
    - title: News
      site_url: /news/
    - title: GitHub
      external_url: https://github.com/coin-or/coin-or.github.io

#Topnav dropdowns
topnav_dropdowns:
- title: Topnav dropdowns
  folders:
    - title: Guides
      folderitems:
      - title: User Guide
        url: /user_introduction.html
        output: web
      - title: Developer Guide
        url: /developer_introduction.html
        output: web

