# COIN-OR project catalog, rendered by projects/index.html.
# Converted from the WordPress Projects page (itself generated from each project's .coin-or/projDesc.xml).
#
# categories: the browsing categories, in display order.
# projects:   one entry per project, alphabetical. Fields (all optional except id, name, summary):
#   id            anchor on the Projects page (/projects/#id)
#   description   Markdown
#   manager, homepage, language
#   license       {name, url}
#   linked_projects, third_party   lists of {name, url}; third_party entries also have use (Required/Optional)
#   status        {activity, maturity, stable_version, stable_release}
#   platforms     list of {os, compiler} it builds and passes its unit test on
#   categories    names from the categories list
#   subprojects   for umbrella projects: list of {group, items}
#   notes         Markdown shown at the end (e.g. a pointer to the old home page of a retired project)
