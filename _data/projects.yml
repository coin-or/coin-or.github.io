- id: coin-bazaar
  name: Coin Bazaar
  summary: Small examples and extensions of COIN-OR projects.
  description: The Coin Bazaar project facilitates community involvement in the COIN-OR repositories. This project allows OR researchers to contribute code examples, application examples and code extensions and plugins without directly contributing to a regular COIN-OR project. Thus, this project helps bridge the gap between core package development and package extensions. Specific goals of this project are (1) to manage extensions to COIN-OR packages that have limited subversion access, (2) allow developers and COIN-OR users to share code and application examples, and (3) provide a home for auxilliary software tools that facilitate the use of COIN-OR tools.
