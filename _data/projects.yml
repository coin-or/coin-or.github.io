- id: cmpl
  name: CMPL
  summary: A mathematical programming language and a system for mathematical programming and optimisation of linear optimisation problems.
  description: CMPL is a mathematical programming language and a system for mathematical programming and optimisation of linear optimisation problems. CMPL executes CBC (default), GLPK, SCIP, Gurobi or CPLEX directly to solve the generated model instance. Because it is also possible to transform the mathematical problem into MPS, Free-MPS or OSiL files, alternative solvers can be used. The CMPL distribution contains Coliop which is an (simple) IDE (Integrated Development Environment) for CMPL. The CMPL package also contains pyCMPL, jCMPL and CMPLServer. pyCMPL is the CMPL application programming interface (API) for Python and an interactive shell and jCMPL is CMPL’s Java API. CMPLServer is an XML-RPC-based web service for distributed and grid optimisation that can be used with CMPL, pyCMPL and jCMPL.
  manager: Mike Steglich – mike.steglich at th-wildau dot de
  homepage: https://github.com/coin-or/Cmpl
  license:
    name: GPLv3 (CMPL and Coliop) and LGPLv3 (pyCMPL, jCMPL, CMPLServer)
