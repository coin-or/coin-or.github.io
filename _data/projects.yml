- id: creme
  name: Crème
  summary: An implementation of the randomized thermal relaxation method to find a feasible solution of the Maximum Feasible Subsystem problem.
  description: Crème (COIN-OR RElaxation MEthod) is an implementation of a heuristic for the Maximum Feasible Subsystem (MaxFS) problem. The MaxFS problem consists of finding the subsystem of an infeasible LP such that the subsystem is feasible and contains a maximum number of constraints. Crème implements a randomized and thermal variant of the relaxation method proposed by Agmon (1954) and Motzkin and Schoenberg (1954). Crème is a heuristic that updates an iterate while keeping track of the number of inequalities satisfied at each iteration. See E. Amaldi, P. Belotti, R. Hauser, Randomized Relaxation Methods for the Maximum Feasible Subsystem Problem. In M. Juenger, V. Kaibel (eds.), Integer Programming and Combinatorial Optimization, 11th International IPCO Conference, Berlin, Germany, June 8-10, 2005, pages 249-264, 2005.
