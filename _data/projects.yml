- id: pfunc
  name: PFunc
  summary: A lightweight and portable library that provides C and C++ APIs to express task parallelism.
  description: PFunc, short for Parallel Functions, is a lightweight and portable library that provides C and C++ APIs to express task parallelism. The features offered by PFunc are a strict superset of the features offered by current solutions for task parallelism such as Cilk and Intel’s Threading Building Blocks. Specifically, PFunc extends the feature set of current solutions with custom task scheduling, task priorities and task affinities. Furthermore, PFunc offers task groups for SPMD-style programming and multiple task completion notifications for parallel execution of DAGs. PFunc’s extended feature set is geared towards helping knowledgeable users optimize their application performance.
